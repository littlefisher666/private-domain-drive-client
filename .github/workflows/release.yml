name: Flutter Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "可选；留空时按当前最新版本自动递增 PATCH，例如 1.0.1 → 1.0.2"
        required: false
        type: string
      run_tests:
        description: "是否运行 Flutter 单元测试"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: flutter-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      current_version: ${{ steps.version.outputs.current_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          current_version="${latest_tag#v}"
          requested_version="$REQUESTED_VERSION"
          requested_version="${requested_version#v}"
          if [[ -z "$requested_version" ]]; then
            if [[ -z "$current_version" ]]; then
              version_name="1.0.0"
            elif [[ "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              version_name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              echo "当前最新 Tag 格式错误：$latest_tag"
              exit 1
            fi
          elif [[ "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version_name="$requested_version"
          else
            echo "版本号格式错误：$REQUESTED_VERSION，应为 1.1.2 或 v1.1.2"
            exit 1
          fi
          build_number="${GITHUB_RUN_NUMBER}"
          tag_name="v${version_name}"

          if git rev-parse "$tag_name" >/dev/null 2>&1; then
            echo "版本 tag 已存在：$tag_name，请输入其他版本号。"
            exit 1
          fi

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "current_version=${current_version:-无发布版本}" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "Release version: $tag_name (build $build_number)"
          {
            echo "## 发布版本"
            echo "- 当前最新版本：\`${current_version:-无发布版本}\`"
            echo "- 本次发布版本：\`$tag_name\`"
            echo "- Android 构建号：\`$build_number\`"
            echo "- 运行单元测试：\`${{ inputs.run_tests }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        if: ${{ inputs.run_tests }}
        run: flutter test

      - name: Restore Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEY_ALIAS" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name "${{ needs.prepare.outputs.version_name }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}" \
            --dart-define=FC_BASE_URL="${{ vars.FC_BASE_URL }}" \
            --dart-define=FC_ACCESS_KEY_ID="${{ secrets.FC_ACCESS_KEY_ID }}" \
            --dart-define=FC_ACCESS_KEY_SECRET="${{ secrets.FC_ACCESS_KEY_SECRET }}"

      - name: Prepare APK artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk "private-domain-drive-android-${{ needs.prepare.outputs.tag_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: private-domain-drive-android-*.apk
          if-no-files-found: error

  macos:
    name: Build macOS app
    needs: prepare
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        if: ${{ inputs.run_tests }}
        run: flutter test

      - name: Build unsigned macOS app
        run: |
          flutter build macos --release \
            --build-name "${{ needs.prepare.outputs.version_name }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}" \
            --dart-define=FC_BASE_URL="${{ vars.FC_BASE_URL }}" \
            --dart-define=FC_ACCESS_KEY_ID="${{ secrets.FC_ACCESS_KEY_ID }}" \
            --dart-define=FC_ACCESS_KEY_SECRET="${{ secrets.FC_ACCESS_KEY_SECRET }}"

      - name: Package macOS app
        run: |
          cd build/macos/Build/Products/Release
          app_path="$(find . -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "未找到 macOS 应用包（*.app）"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" \
            "$GITHUB_WORKSPACE/private-domain-drive-macos-${{ needs.prepare.outputs.tag_name }}.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: private-domain-drive-macos-*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release and tag
    needs: [prepare, android, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.tag_name }}
          generate_release_notes: true
          files: |
            dist/private-domain-drive-android-*.apk
            dist/private-domain-drive-macos-*.zip
