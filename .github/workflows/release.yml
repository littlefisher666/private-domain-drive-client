name: 私域网盘发布

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "本次发布的平台"
        required: false
        type: choice
        default: both
        options:
          - both
          - android
          - macos
      version:
        description: "可选；留空时按所选平台各自最新版本自动递增 PATCH，例如 1.0.1 → 1.0.2"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: flutter-release
  cancel-in-progress: false

env:
  RELEASE_BASE_URL: https://github.com/littlefisher666/private-domain-drive-client

jobs:
  prepare:
    name: 准备发布版本
    runs-on: ubuntu-24.04
    outputs:
      publish_android: ${{ steps.version.outputs.publish_android }}
      publish_macos: ${{ steps.version.outputs.publish_macos }}
      android_version_name: ${{ steps.version.outputs.android_version_name }}
      android_tag_name: ${{ steps.version.outputs.android_tag_name }}
      macos_version_name: ${{ steps.version.outputs.macos_version_name }}
      macos_tag_name: ${{ steps.version.outputs.macos_tag_name }}
      build_number: ${{ steps.version.outputs.build_number }}

    steps:
      - name: 检出发布代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置 Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: 解析发布版本
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail

          # 解析版本：入参为平台当前版本（无 tag 时为 1.0.0）与是否手动指定版本，
          # 输出目标版本号。手动指定时两端统一采用该值，否则按平台独立递增 PATCH。
          resolve_version() {
            local platform="$1"
            local prefix="${platform}/"
            local latest_tag current_version
            latest_tag="$(git tag --list "${prefix}v[0-9]*.[0-9]*.[0-9]*" --sort=-version:refname | head -n 1)"
            echo "平台 ${platform} 最新 tag：${latest_tag:-无}" >&2
            if [[ -n "$requested_version" ]]; then
              echo "$requested_version"
              return
            fi
            current_version="${latest_tag#"${prefix}"}"
            current_version="${current_version#v}"
            if [[ -z "$current_version" ]]; then
              echo "1.0.0"
              return
            fi
            if [[ "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              echo "平台 ${platform} 最新 tag 格式错误：$latest_tag" >&2
              return 1
            fi
          }

          requested_version="$REQUESTED_VERSION"
          requested_version="${requested_version#v}"
          if [[ -n "$requested_version" ]] && ! [[ "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号格式错误：$REQUESTED_VERSION，应为 1.1.2 或 v1.1.2"
            exit 1
          fi

          # REST API 触发时 platforms 可能为空，按默认值 both 处理
          PLATFORMS="${PLATFORMS:-both}"
          publish_android=false
          publish_macos=false
          case "$PLATFORMS" in
            both) publish_android=true; publish_macos=true ;;
            android) publish_android=true ;;
            macos) publish_macos=true ;;
            *) echo "无效的发布平台：$PLATFORMS"; exit 1 ;;
          esac

          android_version=""
          macos_version=""
          if [[ "$publish_android" == "true" ]]; then
            android_version="$(resolve_version android)"
          fi
          if [[ "$publish_macos" == "true" ]]; then
            macos_version="$(resolve_version macos)"
          fi

          build_number="${GITHUB_RUN_NUMBER}"

          if [[ "$publish_android" == "true" ]]; then
            android_tag_name="android/v${android_version}"
            if git rev-parse "$android_tag_name" >/dev/null 2>&1; then
              echo "版本 tag 已存在：${android_tag_name}，请输入其他版本号。"
              exit 1
            fi
          fi
          if [[ "$publish_macos" == "true" ]]; then
            macos_tag_name="macos/v${macos_version}"
            if git rev-parse "$macos_tag_name" >/dev/null 2>&1; then
              echo "版本 tag 已存在：${macos_tag_name}，请输入其他版本号。"
              exit 1
            fi
          fi

          echo "publish_android=$publish_android" >> "$GITHUB_OUTPUT"
          echo "publish_macos=$publish_macos" >> "$GITHUB_OUTPUT"
          echo "android_version_name=$android_version" >> "$GITHUB_OUTPUT"
          echo "android_tag_name=${android_tag_name:-}" >> "$GITHUB_OUTPUT"
          echo "macos_version_name=$macos_version" >> "$GITHUB_OUTPUT"
          echo "macos_tag_name=${macos_tag_name:-}" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

          echo "发布平台：$PLATFORMS（Android：$publish_android，macOS：$publish_macos）"
          {
            echo "## 发布版本"
            echo "- 本次发布平台：\`$PLATFORMS\`"
            if [[ "$publish_android" == "true" ]]; then
              echo "- Android 发布版本：\`$android_tag_name\`"
            fi
            if [[ "$publish_macos" == "true" ]]; then
              echo "- macOS 发布版本：\`$macos_tag_name\`"
            fi
            echo "- 构建号：\`$build_number\`"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: 运行单元测试
    needs: prepare
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: 安装 Flutter 依赖
        run: flutter pub get

      - name: 运行单元测试
        run: flutter test

  android:
    name: 构建 Android 安装包
    needs: [prepare, test]
    if: ${{ needs.prepare.outputs.publish_android == 'true' }}
    runs-on: ubuntu-24.04

    steps:
      - name: 检出构建代码
        uses: actions/checkout@v5

      - name: 配置 Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/settings.gradle.kts

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: 安装 Flutter 依赖
        run: flutter pub get

      - name: 还原 Android 签名证书
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEY_ALIAS" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: 构建正式 APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name "${{ needs.prepare.outputs.android_version_name }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}" \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=FC_BASE_URL="${{ vars.FC_BASE_URL }}" \
            --dart-define=FC_ACCESS_KEY_ID="${{ secrets.PDD_FC_INVOKE_ACCESS_KEY_ID }}" \
            --dart-define=FC_ACCESS_KEY_SECRET="${{ secrets.PDD_FC_INVOKE_ACCESS_KEY_SECRET }}"

      # pdfrx/media_kit 把仅供 Web 平台使用的资源无条件打进所有平台包，原生端永远不会加载。
      # AGP 的 packaging 过滤对 Flutter 注入的 flutter_assets 不生效，只能在构建后从 APK 剔除。
      # zip -d 重写压缩包会破坏条目对齐与签名，因此需要重新 zipalign 并重签。
      - name: 剔除 Web 平台专用资源并重签 APK
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          build_tools_dir="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          zip -d "$apk" \
            "assets/flutter_assets/packages/pdfrx/assets/*" \
            "assets/flutter_assets/packages/media_kit/assets/web/*"
          "$build_tools_dir/zipalign" -f -p 4 "$apk" app-release-stripped.apk
          mv app-release-stripped.apk "$apk"
          "$build_tools_dir/apksigner" sign \
            --ks android/upload-keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            "$apk"
          "$build_tools_dir/apksigner" verify "$apk"

      - name: 整理 APK 发布文件
        run: cp build/app/outputs/flutter-apk/app-release.apk "private-domain-drive-android-v${{ needs.prepare.outputs.android_version_name }}.apk"

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: private-domain-drive-android-*.apk
          if-no-files-found: error

      # 混淆符号与构建一一对应，随流水线运行归档，用于 flutter symbolize 还原线上崩溃堆栈。
      - name: 上传混淆符号
        uses: actions/upload-artifact@v7
        with:
          name: android-symbols
          path: build/symbols/
          if-no-files-found: error

  macos:
    name: 构建 macOS 应用
    needs: [prepare, test]
    if: ${{ needs.prepare.outputs.publish_macos == 'true' }}
    runs-on: macos-latest

    steps:
      - name: 检出构建代码
        uses: actions/checkout@v5

      - name: 配置 Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          # Flutter SDK 缓存约 2GB，在 macOS Runner 上还原耗时较长；保留较小的 Pub 依赖缓存。
          cache: false
          pub-cache: true

      - name: 安装 Flutter 依赖
        run: flutter pub get

      - name: 构建未签名 macOS 应用
        run: |
          flutter build macos --release \
            --build-name "${{ needs.prepare.outputs.macos_version_name }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}" \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=FC_BASE_URL="${{ vars.FC_BASE_URL }}" \
            --dart-define=FC_ACCESS_KEY_ID="${{ secrets.PDD_FC_INVOKE_ACCESS_KEY_ID }}" \
            --dart-define=FC_ACCESS_KEY_SECRET="${{ secrets.PDD_FC_INVOKE_ACCESS_KEY_SECRET }}"

      - name: 剔除 Web 平台专用资源
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "未找到 macOS 应用包（*.app）"
            exit 1
          fi
          assets_dir="$app_path/Contents/Frameworks/App.framework/Resources/flutter_assets"
          # pdfrx/media_kit 把仅供 Web 平台使用的资源无条件打进所有平台包，原生端永远不会加载。
          rm -f "$assets_dir"/packages/pdfrx/assets/*
          rm -f "$assets_dir"/packages/media_kit/assets/web/*.js

      # 混淆符号与构建一一对应，随流水线运行归档，用于 flutter symbolize 还原线上崩溃堆栈。
      - name: 上传混淆符号
        uses: actions/upload-artifact@v7
        with:
          name: macos-symbols
          path: build/symbols/
          if-no-files-found: error

      - name: 打包 macOS 应用
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "未找到 macOS 应用包（*.app）"
            exit 1
          fi
          staging_directory="$(mktemp -d)"
          trap 'rm -rf "$staging_directory"' EXIT
          ditto "$app_path" "$staging_directory/$(basename "$app_path")"
          ln -s /Applications "$staging_directory/Applications"
          hdiutil create \
            -volname "私域网盘" \
            -srcfolder "$staging_directory" \
            -ov \
            -format UDZO \
            "$GITHUB_WORKSPACE/private-domain-drive-macos-v${{ needs.prepare.outputs.macos_version_name }}.dmg"

      - name: 打包 Sparkle 更新包
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "未找到 macOS 应用包（*.app）"
            exit 1
          fi
          # 用 ditto 保留扩展属性与签名元数据，Sparkle 更新载荷必须保留这些信息。
          ditto -c -k --keepParent "$app_path" \
            "$GITHUB_WORKSPACE/private-domain-drive-macos-v${{ needs.prepare.outputs.macos_version_name }}.zip"

      - name: 签名 Sparkle 更新包
        id: sparkle_sign
        # 签名失败时按设计降级：该版本仅发布 DMG，不阻塞流水线。
        continue-on-error: true
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          MACOS_VERSION: ${{ needs.prepare.outputs.macos_version_name }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_EDDSA_PRIVATE_KEY" ]]; then
            echo "未配置 SPARKLE_EDDSA_PRIVATE_KEY，跳过 Sparkle 签名"
            exit 1
          fi
          zip_file="$GITHUB_WORKSPACE/private-domain-drive-macos-v${MACOS_VERSION}.zip"
          sparkle_dir="$RUNNER_TEMP/sparkle"
          curl -sSfL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz
          mkdir -p "$sparkle_dir"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$sparkle_dir"
          key_file="$RUNNER_TEMP/eddsa_private_key.txt"
          printf '%s\n' "$SPARKLE_EDDSA_PRIVATE_KEY" > "$key_file"
          trap 'rm -f "$key_file"' EXIT
          sign_output="$("$sparkle_dir/bin/sign_update" --ed-key-file "$key_file" -p "$zip_file")"
          signature="$(printf '%s' "$sign_output" | tr -d '\n')"
          if [[ -z "$signature" ]]; then
            echo "Sparkle 签名输出为空"
            exit 1
          fi
          echo "signature=$signature" >> "$GITHUB_OUTPUT"

      - name: 记录 Sparkle 签名结果
        if: ${{ steps.sparkle_sign.outcome == 'success' }}
        env:
          MACOS_VERSION: ${{ needs.prepare.outputs.macos_version_name }}
          SPARKLE_SIGNATURE: ${{ steps.sparkle_sign.outputs.signature }}
        run: |
          set -euo pipefail
          zip_file="$GITHUB_WORKSPACE/private-domain-drive-macos-v${MACOS_VERSION}.zip"
          file_length="$(stat -f%z "$zip_file")"
          {
            echo "signature=$SPARKLE_SIGNATURE"
            echo "length=$file_length"
            echo "zip_name=private-domain-drive-macos-v${MACOS_VERSION}.zip"
          } > "$GITHUB_WORKSPACE/sparkle-signature.env"
          cat "$GITHUB_WORKSPACE/sparkle-signature.env"

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: private-domain-drive-macos-*.dmg
          if-no-files-found: error

      - name: 上传 Sparkle 更新包
        uses: actions/upload-artifact@v7
        with:
          name: macos-sparkle
          path: |
            private-domain-drive-macos-*.zip
            sparkle-signature.env
          # 签名降级时仅发布 DMG，此产物允许缺失。
          if-no-files-found: ignore

  release:
    name: 创建 GitHub Release
    needs: [prepare, android, macos]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.android.result != 'failure' && needs.macos.result != 'failure' }}
    runs-on: ubuntu-24.04

    steps:
      - name: 检出发布代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 配置 Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: 读取 Sparkle 签名结果
        env:
          MACOS_VERSION: ${{ needs.prepare.outputs.macos_version_name }}
        run: |
          set -euo pipefail
          if [[ ! -f dist/sparkle-signature.env ]]; then
            echo "本次发布无 Sparkle 更新包（签名降级），仅发布 DMG"
            exit 0
          fi
          cat dist/sparkle-signature.env
          . dist/sparkle-signature.env
          {
            echo "sparkle_enabled=true"
            echo "sparkle_zip_name=${zip_name}"
            echo "sparkle_signature=${signature}"
            echo "sparkle_length=${length}"
            echo "sparkle_extra_files=dist/private-domain-drive-macos-v${MACOS_VERSION}.zip"
          } >> "$GITHUB_ENV"

      - name: 计算发布文件摘要
        env:
          PUBLISH_ANDROID: ${{ needs.prepare.outputs.publish_android }}
          PUBLISH_MACOS: ${{ needs.prepare.outputs.publish_macos }}
          ANDROID_VERSION: ${{ needs.prepare.outputs.android_version_name }}
          MACOS_VERSION: ${{ needs.prepare.outputs.macos_version_name }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_ANDROID" == "true" ]]; then
            android_name="private-domain-drive-android-v${ANDROID_VERSION}.apk"
            android_digest="sha256:$(sha256sum "dist/$android_name" | awk '{print $1}')"
            echo "android_name=$android_name" >> "$GITHUB_ENV"
            echo "android_digest=$android_digest" >> "$GITHUB_ENV"
          fi
          if [[ "$PUBLISH_MACOS" == "true" ]]; then
            macos_name="private-domain-drive-macos-v${MACOS_VERSION}.dmg"
            macos_digest="sha256:$(sha256sum "dist/$macos_name" | awk '{print $1}')"
            echo "macos_name=$macos_name" >> "$GITHUB_ENV"
            echo "macos_digest=$macos_digest" >> "$GITHUB_ENV"
          fi

      - name: 生成发布说明
        env:
          PUBLISH_ANDROID: ${{ needs.prepare.outputs.publish_android }}
          PUBLISH_MACOS: ${{ needs.prepare.outputs.publish_macos }}
          ANDROID_TAG_NAME: ${{ needs.prepare.outputs.android_tag_name }}
          MACOS_TAG_NAME: ${{ needs.prepare.outputs.macos_tag_name }}
        run: |
          set -euo pipefail

          # 说明范围：上一次同平台版本 tag 到本次提交；开头标注发布平台并在同步发布时互链对方 Release。
          generate_notes() {
            local platform="$1"
            local new_tag="$2"
            local other_tag="$3"
            local prefix="${platform}/"
            local previous_tag compare_range
            previous_tag="$(git tag --list "${prefix}v[0-9]*.[0-9]*.[0-9]*" --sort=-version:refname | head -n 1)"
            compare_range="${previous_tag:+$previous_tag..}HEAD"
            echo "[$platform] 提交范围：$compare_range"

            local features="" fixes="" others=""
            while IFS= read -r subject; do
              if ! printf '%s\n' "$subject" | grep -Eq '^(feat|fix|perf|refactor|style|build)(\([^)]*\))?(!)?: '; then
                continue
              fi
              local type scope breaking desc entry
              type="$(printf '%s\n' "$subject" | sed -E 's/^([a-z]+)(\([^)]*\))?(!)?: .*/\1/')"
              scope="$(printf '%s\n' "$subject" | sed -E -n 's/^[a-z]+\(([^)]*)\).*/\1/p')"
              breaking="$(printf '%s\n' "$subject" | sed -E 's/^[a-z]+(\([^)]*\))?(!)?: .*/\2/')"
              desc="$(printf '%s\n' "$subject" | sed -E 's/^[a-z]+(\([^)]*\))?(!)?: //')"
              if [[ "$breaking" == "!" ]]; then
                desc="${desc}（不兼容变更）"
              fi
              if [[ -n "$scope" ]]; then
                entry="- ${desc}（${scope}）"
              else
                entry="- $desc"
              fi
              case "$type" in
                feat) features="${features}${entry}"$'\n' ;;
                fix) fixes="${fixes}${entry}"$'\n' ;;
                *) others="${others}${entry}"$'\n' ;;
              esac
            done < <(git log --format=%s "$compare_range")

            if [[ -z "$features$fixes$others" ]]; then
              others="- 例行发布，无用户可感知的变更。"$'\n'
            fi

            local platform_line="发布平台：${platform}"
            if [[ -n "$other_tag" ]]; then
              platform_line="${platform_line}（另一端本次同步发布：[${other_tag}](${RELEASE_BASE_URL}/releases/tag/${other_tag})）"
            fi

            emit_markdown() {
              if [[ -n "$2" ]]; then
                echo ""
                echo "### $1"
                printf '%s' "$2"
              fi
            }
            {
              echo "> $platform_line"
              echo "## 更新内容"
              emit_markdown "新功能" "$features"
              emit_markdown "修复" "$fixes"
              emit_markdown "优化" "$others"
            } > "release_notes_${platform}.md"

            emit_plain() {
              if [[ -n "$2" ]]; then
                echo "【${1}】"
                printf '%s' "$2"
                echo ""
              fi
            }
            {
              emit_plain "新功能" "$features"
              emit_plain "修复" "$fixes"
              emit_plain "优化" "$others"
            } > "release_notes_plain_${platform}.txt"
          }

          if [[ "$PUBLISH_ANDROID" == "true" ]]; then
            other_tag=""
            if [[ "$PUBLISH_MACOS" == "true" ]]; then
              other_tag="$MACOS_TAG_NAME"
            fi
            generate_notes android "$ANDROID_TAG_NAME" "$other_tag"
          fi
          if [[ "$PUBLISH_MACOS" == "true" ]]; then
            other_tag=""
            if [[ "$PUBLISH_ANDROID" == "true" ]]; then
              other_tag="$ANDROID_TAG_NAME"
            fi
            generate_notes macos "$MACOS_TAG_NAME" "$other_tag"
          fi

          echo "--- Release 说明预览 ---"
          for platform in android macos; do
            if [[ -f "release_notes_${platform}.md" ]]; then
              echo "[$platform]"
              cat "release_notes_${platform}.md"
            fi
          done

      - name: 生成平台更新清单
        env:
          PUBLISH_ANDROID: ${{ needs.prepare.outputs.publish_android }}
          PUBLISH_MACOS: ${{ needs.prepare.outputs.publish_macos }}
          ANDROID_VERSION: ${{ needs.prepare.outputs.android_version_name }}
          MACOS_VERSION: ${{ needs.prepare.outputs.macos_version_name }}
          ANDROID_TAG_NAME: ${{ needs.prepare.outputs.android_tag_name }}
          MACOS_TAG_NAME: ${{ needs.prepare.outputs.macos_tag_name }}
        run: |
          set -euo pipefail
          # 每个平台 Release 附带自己的清单，assets 仅含该平台字段；清单版本与平台 tag 版本一致。
          if [[ "$PUBLISH_ANDROID" == "true" ]]; then
            mkdir -p dist/android
            android_url="${RELEASE_BASE_URL}/releases/download/${ANDROID_TAG_NAME}/${android_name}"
            jq -n \
              --arg version "$ANDROID_VERSION" \
              --rawfile notes release_notes_plain_android.txt \
              --arg name "$android_name" --arg url "$android_url" --arg digest "$android_digest" \
              '{version: $version, notes: ($notes | gsub("\\s+$"; "")), assets: {android: {name: $name, url: $url, digest: $digest}}}' \
              > dist/android/private-domain-drive-update.json
          fi
          if [[ "$PUBLISH_MACOS" == "true" ]]; then
            mkdir -p dist/macos
            macos_url="${RELEASE_BASE_URL}/releases/download/${MACOS_TAG_NAME}/${macos_name}"
            jq -n \
              --arg version "$MACOS_VERSION" \
              --rawfile notes release_notes_plain_macos.txt \
              --arg name "$macos_name" --arg url "$macos_url" --arg digest "$macos_digest" \
              '{version: $version, notes: ($notes | gsub("\\s+$"; "")), assets: {macos: {name: $name, url: $url, digest: $digest}}}' \
              > dist/macos/private-domain-drive-update.json
          fi

      - name: 创建 Android Release
        if: ${{ needs.prepare.outputs.publish_android == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.android_tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.android_tag_name }}
          body_path: release_notes_android.md
          generate_release_notes: true
          files: |
            dist/private-domain-drive-android-*.apk
            dist/android/private-domain-drive-update.json

      - name: 创建 macOS Release
        if: ${{ needs.prepare.outputs.publish_macos == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.macos_tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.macos_tag_name }}
          body_path: release_notes_macos.md
          generate_release_notes: true
          files: |
            dist/private-domain-drive-macos-*.dmg
            ${{ env.sparkle_extra_files }}
            dist/macos/private-domain-drive-update.json

      - name: 维护 appcast 清单
        if: ${{ needs.prepare.outputs.publish_macos == 'true' && env.sparkle_enabled == 'true' }}
        env:
          MACOS_VERSION: ${{ needs.prepare.outputs.macos_version_name }}
          MACOS_TAG_NAME: ${{ needs.prepare.outputs.macos_tag_name }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          SPARKLE_ZIP_NAME: ${{ env.sparkle_zip_name }}
          SPARKLE_SIGNATURE: ${{ env.sparkle_signature }}
          SPARKLE_LENGTH: ${{ env.sparkle_length }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch appcast "$repo_url" appcast_repo 2>/dev/null; then
            echo "已克隆现有 appcast 分支"
            cd appcast_repo
          else
            echo "appcast 分支不存在，首次生成"
            mkdir appcast_repo
            cd appcast_repo
            git init -b appcast
            git remote add origin "$repo_url"
          fi

          export MACOS_VERSION MACOS_TAG_NAME BUILD_NUMBER SPARKLE_ZIP_NAME SPARKLE_SIGNATURE SPARKLE_LENGTH
          export RELEASE_BASE_URL MACOS_NOTES_FILE="$GITHUB_WORKSPACE/release_notes_plain_macos.txt"
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          SPARKLE_NS = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          DC_NS = "http://purl.org/dc/elements/1.1/"
          ET.register_namespace("sparkle", SPARKLE_NS)
          ET.register_namespace("dc", DC_NS)

          version = os.environ["MACOS_VERSION"]
          build = os.environ["BUILD_NUMBER"]
          tag = os.environ["MACOS_TAG_NAME"]
          zip_name = os.environ["SPARKLE_ZIP_NAME"]
          signature = os.environ["SPARKLE_SIGNATURE"]
          length = os.environ["SPARKLE_LENGTH"]
          base_url = os.environ["RELEASE_BASE_URL"]

          notes = "例行发布，无用户可感知的变更。"
          notes_path = os.environ.get("MACOS_NOTES_FILE")
          if notes_path and os.path.exists(notes_path):
              with open(notes_path, encoding="utf-8") as fh:
                  text = fh.read().strip()
              if text:
                  notes = text

          path = "appcast.xml"
          if os.path.exists(path):
              tree = ET.parse(path)
              root = tree.getroot()
              channel = root.find("channel")
          else:
              root = ET.Element("rss", {"version": "2.0"})
              tree = ET.ElementTree(root)
              channel = ET.SubElement(root, "channel")
              ET.SubElement(channel, "title").text = "私域网盘"
              ET.SubElement(channel, "link").text = base_url
              ET.SubElement(channel, "description").text = "私域网盘 macOS 客户端 Sparkle 更新清单"
              ET.SubElement(channel, "language").text = "zh-cn"

          def qualified(name):
              return "{" + SPARKLE_NS + "}" + name

          for item in list(channel.findall("item")):
              if (item.findtext(qualified("version")) == build
                      or item.findtext(qualified("shortVersionString")) == version):
                  channel.remove(item)

          new_item = ET.SubElement(channel, "item")
          ET.SubElement(new_item, "title").text = "私域网盘 macOS v" + version
          ET.SubElement(new_item, "link").text = base_url + "/releases/tag/" + tag
          ET.SubElement(new_item, qualified("version")).text = build
          ET.SubElement(new_item, qualified("shortVersionString")).text = version
          ET.SubElement(new_item, "pubDate").text = datetime.now(timezone.utc).strftime(
              "%a, %d %b %Y %H:%M:%S +0000")
          ET.SubElement(new_item, "description").text = notes
          enclosure = ET.SubElement(new_item, "enclosure")
          enclosure.set("url", base_url + "/releases/download/" + tag + "/" + zip_name)
          enclosure.set("length", length)
          enclosure.set("type", "application/zip")
          enclosure.set(qualified("edSignature"), signature)

          def build_number_of(item):
              raw = item.findtext(qualified("version")) or "0"
              try:
                  return int(raw)
              except ValueError:
                  return 0

          items = sorted(channel.findall("item"), key=build_number_of, reverse=True)
          for item in items:
              channel.remove(item)
          for item in items:
              channel.append(item)

          ET.indent(tree, space="  ")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          print(open(path, encoding="utf-8").read())
          PY

          if [[ -n "$(git status --porcelain -- appcast.xml)" ]]; then
            git add appcast.xml
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore(appcast): macOS v${MACOS_VERSION} 更新条目"
            git push origin appcast
            echo "appcast 已推送到 appcast 分支"
          else
            echo "appcast.xml 无变化，跳过推送"
          fi
