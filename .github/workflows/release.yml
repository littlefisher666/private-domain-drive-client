name: 私域网盘发布

on:
  workflow_dispatch:
    inputs:
      version:
        description: "可选；留空时按当前最新版本自动递增 PATCH，例如 1.0.1 → 1.0.2"
        required: false
        type: string
      run_tests:
        description: "是否运行 Flutter 单元测试"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: flutter-release
  cancel-in-progress: false

jobs:
  prepare:
    name: 准备发布版本
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      current_version: ${{ steps.version.outputs.current_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: 检出发布代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析发布版本
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          current_version="${latest_tag#v}"
          requested_version="$REQUESTED_VERSION"
          requested_version="${requested_version#v}"
          if [[ -z "$requested_version" ]]; then
            if [[ -z "$current_version" ]]; then
              version_name="1.0.0"
            elif [[ "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              version_name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              echo "当前最新 Tag 格式错误：$latest_tag"
              exit 1
            fi
          elif [[ "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version_name="$requested_version"
          else
            echo "版本号格式错误：$REQUESTED_VERSION，应为 1.1.2 或 v1.1.2"
            exit 1
          fi
          build_number="${GITHUB_RUN_NUMBER}"
          tag_name="v${version_name}"

          if git rev-parse "$tag_name" >/dev/null 2>&1; then
            echo "版本 tag 已存在：$tag_name，请输入其他版本号。"
            exit 1
          fi

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "current_version=${current_version:-无发布版本}" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "发布版本：$tag_name（构建号：$build_number）"
          {
            echo "## 发布版本"
            echo "- 当前最新版本：\`${current_version:-无发布版本}\`"
            echo "- 本次发布版本：\`$tag_name\`"
            echo "- Android 构建号：\`$build_number\`"
            echo "- 运行单元测试：\`${{ inputs.run_tests }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: 构建 Android 安装包
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: 检出构建代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/settings.gradle.kts

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: 安装 Flutter 依赖
        run: flutter pub get

      - name: 运行单元测试
        if: ${{ inputs.run_tests }}
        run: flutter test

      - name: 还原 Android 签名证书
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEY_ALIAS" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: 构建正式 APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name "${{ needs.prepare.outputs.version_name }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}" \
            --dart-define=FC_BASE_URL="${{ vars.FC_BASE_URL }}" \
            --dart-define=FC_ACCESS_KEY_ID="${{ secrets.FC_ACCESS_KEY_ID }}" \
            --dart-define=FC_ACCESS_KEY_SECRET="${{ secrets.FC_ACCESS_KEY_SECRET }}"

      - name: 整理 APK 发布文件
        run: cp build/app/outputs/flutter-apk/app-release.apk "private-domain-drive-android-${{ needs.prepare.outputs.tag_name }}.apk"

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: private-domain-drive-android-*.apk
          if-no-files-found: error

  macos:
    name: 构建 macOS 应用
    needs: prepare
    runs-on: macos-latest

    steps:
      - name: 检出构建代码
        uses: actions/checkout@v4

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: 安装 Flutter 依赖
        run: flutter pub get

      - name: 运行单元测试
        if: ${{ inputs.run_tests }}
        run: flutter test

      - name: 构建未签名 macOS 应用
        run: |
          flutter build macos --release \
            --build-name "${{ needs.prepare.outputs.version_name }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}" \
            --dart-define=FC_BASE_URL="${{ vars.FC_BASE_URL }}" \
            --dart-define=FC_ACCESS_KEY_ID="${{ secrets.FC_ACCESS_KEY_ID }}" \
            --dart-define=FC_ACCESS_KEY_SECRET="${{ secrets.FC_ACCESS_KEY_SECRET }}"

      - name: 打包 macOS 应用
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "未找到 macOS 应用包（*.app）"
            exit 1
          fi
          staging_directory="$(mktemp -d)"
          trap 'rm -rf "$staging_directory"' EXIT
          ditto "$app_path" "$staging_directory/$(basename "$app_path")"
          ln -s /Applications "$staging_directory/Applications"
          hdiutil create \
            -volname "私域网盘" \
            -srcfolder "$staging_directory" \
            -ov \
            -format UDZO \
            "$GITHUB_WORKSPACE/private-domain-drive-macos-${{ needs.prepare.outputs.tag_name }}.dmg"

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: private-domain-drive-macos-*.dmg
          if-no-files-found: error

  release:
    name: 创建 GitHub 与 Gitee Release
    needs: [prepare, android, macos]
    runs-on: ubuntu-latest

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 计算发布文件摘要
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          android_name="private-domain-drive-android-${TAG_NAME}.apk"
          macos_name="private-domain-drive-macos-${TAG_NAME}.dmg"
          android_digest="sha256:$(sha256sum "dist/$android_name" | awk '{print $1}')"
          macos_digest="sha256:$(sha256sum "dist/$macos_name" | awk '{print $1}')"
          echo "android_name=$android_name" >> "$GITHUB_ENV"
          echo "macos_name=$macos_name" >> "$GITHUB_ENV"
          echo "android_digest=$android_digest" >> "$GITHUB_ENV"
          echo "macos_digest=$macos_digest" >> "$GITHUB_ENV"

      - name: 创建 Gitee Release 并上传安装包
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          test -n "$GITEE_TOKEN"
          api_url="https://gitee.com/api/v5/repos/litttlefisher/private-domain-drive-client/releases"
          release="$(curl --fail-with-body --silent --show-error \
            --request POST "$api_url" \
            --form "access_token=$GITEE_TOKEN" \
            --form "tag_name=$TAG_NAME" \
            --form "target_commitish=master" \
            --form "name=$TAG_NAME" \
            --form "body=由 GitHub Actions 自动发布")"
          release_id="$(jq -r '.id // empty' <<< "$release")"
          test -n "$release_id"
          for asset in "$android_name" "$macos_name"; do
            asset_path="dist/$asset"
            printf '开始上传 Gitee 附件：%s（%s）\n' "$asset" "$(du -h "$asset_path" | cut -f1)"
            curl --fail-with-body --show-error --progress-bar \
              --connect-timeout 20 \
              --max-time 300 \
              --retry 3 \
              --retry-delay 5 \
              --retry-connrefused \
              --write-out '\nGitee 附件上传完成：HTTP %{response_code}，耗时 %{time_total}s，平均上传速率 %{speed_upload} B/s\n' \
              --request POST "$api_url/$release_id/attach_files" \
              --form "access_token=$GITEE_TOKEN" \
              --form "file=@$asset_path"
          done
          echo "gitee_release_id=$release_id" >> "$GITHUB_ENV"

      - name: 生成 Gitee 更新清单
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
        run: |
          api_url="https://gitee.com/api/v5/repos/litttlefisher/private-domain-drive-client/releases/${gitee_release_id}"
          release="$(curl --fail-with-body --silent --show-error \
            --get "$api_url" \
            --data-urlencode "access_token=$GITEE_TOKEN")"
          android_url="$(jq -r --arg name "$android_name" '.assets[] | select(.name == $name) | (.browser_download_url // .download_url // .url)' <<< "$release")"
          macos_url="$(jq -r --arg name "$macos_name" '.assets[] | select(.name == $name) | (.browser_download_url // .download_url // .url)' <<< "$release")"
          test -n "$android_url" && test "$android_url" != "null"
          test -n "$macos_url" && test "$macos_url" != "null"
          jq -n \
            --arg version "$VERSION_NAME" \
            --arg android_name "$android_name" --arg android_url "$android_url" --arg android_digest "$android_digest" \
            --arg macos_name "$macos_name" --arg macos_url "$macos_url" --arg macos_digest "$macos_digest" \
            '{version: $version, notes: "", assets: {android: {name: $android_name, url: $android_url, digest: $android_digest}, macos: {name: $macos_name, url: $macos_url, digest: $macos_digest}}}' \
            > dist/private-domain-drive-update.json

      - name: 上传 Gitee 更新清单
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          update_manifest="dist/private-domain-drive-update.json"
          printf '开始上传 Gitee 更新清单：%s\n' "$(du -h "$update_manifest" | cut -f1)"
          curl --fail-with-body --show-error --progress-bar \
            --connect-timeout 20 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            --write-out '\nGitee 更新清单上传完成：HTTP %{response_code}，耗时 %{time_total}s\n' \
            --request POST "https://gitee.com/api/v5/repos/litttlefisher/private-domain-drive-client/releases/${gitee_release_id}/attach_files" \
            --form "access_token=$GITEE_TOKEN" \
            --form "file=@$update_manifest"

      - name: 生成 GitHub 更新清单
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
        run: |
          release_url="https://github.com/littlefisher666/private-domain-drive-client/releases/download/${TAG_NAME}"
          jq -n \
            --arg version "$VERSION_NAME" \
            --arg android_name "$android_name" --arg android_url "$release_url/$android_name" --arg android_digest "$android_digest" \
            --arg macos_name "$macos_name" --arg macos_url "$release_url/$macos_name" --arg macos_digest "$macos_digest" \
            '{version: $version, notes: "", assets: {android: {name: $android_name, url: $android_url, digest: $android_digest}, macos: {name: $macos_name, url: $macos_url, digest: $macos_digest}}}' \
            > dist/private-domain-drive-update.json

      - name: 创建发布标签与 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.tag_name }}
          generate_release_notes: true
          files: |
            dist/private-domain-drive-android-*.apk
            dist/private-domain-drive-macos-*.dmg
            dist/private-domain-drive-update.json
