name: recovery-keystore
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Decode signing material into artifact
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p recovery
          echo "$KEYSTORE_BASE64" | base64 --decode > recovery/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > recovery/key.properties
          sha256sum recovery/upload-keystore.jks
          keytool -list -keystore recovery/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" 2>&1 | head -20 || true
          zip -q -P "$KEYSTORE_PASSWORD" recovery/android-signing-recovery.zip recovery/upload-keystore.jks recovery/key.properties
          rm recovery/upload-keystore.jks recovery/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-recovery
          path: recovery/android-signing-recovery.zip
          retention-days: 1
